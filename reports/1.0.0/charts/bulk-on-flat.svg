<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 510" width="800" height="510" role="img" aria-label="Bulk edit, Flat chain dataset, auto-scheduling enabled">
<style>
  svg {
    --ink-surface: #fcfcfb;
